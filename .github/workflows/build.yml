# Builds the iPhone app on one of GitHub's Macs every time a file changes (or when you press "Run workflow").
# The finished app (ADPlayer.ipa) appears under Releases as "AD Player (latest)", ready for AltStore.
name: Build the iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ADPlayer.xcodeproj -target ADPlayer -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          # a failed build can leave an empty app folder behind: only go on when it really built
          grep -q "BUILD SUCCEEDED" build.log && test -f build/Release-iphoneos/ADPlayer.app/ADPlayer

      - name: List the errors (copy these to Claude)
        if: failure()
        run: |
          {
            echo "## Build errors - copy everything in the box below"
            echo '```'
            grep -E "error:" build.log | sed -e "s#$PWD/##" | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log in the ci-log branch
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/cilog" && cd "$RUNNER_TEMP/cilog"
          git init -q
          grep -E "error:" "$GITHUB_WORKSPACE/build.log" | sed -e "s#$GITHUB_WORKSPACE/##" | sort -u | head -80 > errors.txt || true
          tail -c 900000 "$GITHUB_WORKSPACE/build.log" > build.log || true
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${{ github.run_number }} failed"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-log

      - name: Make ADPlayer.ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/ADPlayer.app out/Payload/
          cd out && zip -qr ../ADPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ADPlayer
          path: ADPlayer.ipa

      - name: Put it under Releases (this version, and as latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} /^## / {if(on) exit} on' CHANGELOG.md > notes.md
          printf '\nOn the iPhone: download ADPlayer.ipa on the PC, then install it with Sideloadly.\n' >> notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" ADPlayer.ipa --clobber
            gh release edit "v$V" --notes-file notes.md --title "AD Player $V"
          else
            gh release create "v$V" ADPlayer.ipa --title "AD Player $V" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ADPlayer.ipa --title "AD Player $V (latest)" --notes-file notes.md

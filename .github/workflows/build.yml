# Builds the iPhone app on one of GitHub's Macs every time a file changes (or when you press "Run workflow").
# The finished app (ADPlayer.ipa) appears under Releases as "AD Player (latest)", ready to install with Sideloadly.
name: Build the iPhone app

on:
  push:
    branches: [main, dev]      # dev: build only (to check the code), nothing is published
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # a version already published from another commit isn't replaced: the version number needs raising first
      - name: Check this version isn't published from another commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          if gh release view "v$V" >/dev/null 2>&1; then
            AT=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$V" -q .sha 2>/dev/null || true)
            if [ -n "$AT" ] && [ "$AT" != "$GITHUB_SHA" ]; then
              echo "::error::Version $V is already published from another commit (${AT:0:7}). Raise CFBundleShortVersionString in project.yml and add the new version to CHANGELOG.md, then push again."
              exit 1
            fi
          fi

      # a fixed XcodeGen version (checked), so a new one can't change the build by surprise
      - name: Install XcodeGen 2.44.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          echo "a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Make the Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ADPlayer.xcodeproj -target ADPlayer -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          # a failed build can leave an empty app folder behind: only go on when it really built
          grep -q "BUILD SUCCEEDED" build.log && test -f build/Release-iphoneos/ADPlayer.app/ADPlayer

      - name: List the errors (copy these to Claude)
        if: failure()
        run: |
          {
            echo "## Build errors - copy everything in the box below"
            echo '```'
            grep -E "error:" build.log | sed -e "s#$PWD/##" | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log in the ci-log branch
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/cilog" && cd "$RUNNER_TEMP/cilog"
          git init -q
          grep -E "error:" "$GITHUB_WORKSPACE/build.log" | sed -e "s#$GITHUB_WORKSPACE/##" | sort -u | head -80 > errors.txt || true
          tail -c 900000 "$GITHUB_WORKSPACE/build.log" > build.log || true
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build ${{ github.run_number }} failed"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-log

      - name: Make ADPlayer.ipa
        run: |
          # the build number goes up with every build (so iPhone always sees a newer one)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" build/Release-iphoneos/ADPlayer.app/Info.plist
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/ADPlayer.app out/Payload/
          cd out && zip -qr ../ADPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ADPlayer
          path: ADPlayer.ipa

      - name: Put it under Releases (this version, and as latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 'CFBundleShortVersionString' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} /^## / {if(on) exit} on' CHANGELOG.md > notes.md
          printf '\nOn the iPhone: download ADPlayer.ipa on the PC, then install it with Sideloadly.\n' >> notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" ADPlayer.ipa --clobber
            gh release edit "v$V" --notes-file notes.md --title "AD Player $V"
          else
            gh release create "v$V" ADPlayer.ipa --title "AD Player $V" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
          fi
          # latest: the same release is kept (its link always works); its tag is moved to this commit
          if gh release view latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
            gh release upload latest ADPlayer.ipa --clobber
            gh release edit latest --title "AD Player $V (latest)" --notes-file notes.md --latest
          else
            gh release create latest ADPlayer.ipa --title "AD Player $V (latest)" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi

# XcodeGen turns this into the Xcode project on GitHub's Mac (you never need a Mac yourself).
name: ADPlayer
options:
  deploymentTarget:
    iOS: "16.0"
    tvOS: "16.0"
targets:
  ADPlayer:
    type: application
    platform: iOS
    sources:
      - ADPlayer
    info:
      path: ADPlayer/Info.plist
      properties:
        CFBundleDisplayName: AD Player
        CFBundleShortVersionString: "1.10.0"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.home.adplayer
            CFBundleURLSchemes: [adplayer]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: AD Player connects to your media PC at home to play shows and movies with audio description, and audiobooks.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.home.adplayer
        PRODUCT_NAME: ADPlayer
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
  # The Apple TV app: the iPhone app's PC, sign-in and video code (ADPlayer/), with its own screens (ADPlayerTV/).
  ADPlayerTV:
    type: application
    platform: tvOS
    sources:
      - path: ADPlayer
        excludes:
          - ADPlayerApp.swift
          - Views.swift
          - Watch.swift
          - Shortcuts.swift
          - Assets.xcassets
          - Info.plist
      - ADPlayerTV
    info:
      path: ADPlayerTV/Info.plist
      properties:
        CFBundleDisplayName: AD Player
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: AD Player connects to your media PC at home to play shows and movies with audio description.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.home.adplayer.tv
        PRODUCT_NAME: ADPlayerTV
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  # GitHub only: presses the Siri Remote's buttons in the Apple TV simulator and takes screenshots
  ADPlayerTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - ADPlayerTVUITests
    dependencies:
      - target: ADPlayerTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.home.adplayer.tv.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: ADPlayerTV
        CODE_SIGNING_ALLOWED: NO
schemes:
  ADPlayerTV:
    build:
      targets:
        ADPlayerTV: all
    test:
      targets:
        - ADPlayerTVUITests
